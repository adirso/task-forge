# Include inside the TLS server {} context that proxies to the TaskForge API.
# Define an upstream named taskforge_api in the http {} context.
location = /api/auth/login {
    limit_req zone=taskforge_login_by_ip burst=5 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://taskforge_api;
}
